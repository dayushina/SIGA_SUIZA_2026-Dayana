# SIGA - entorno de desarrollo local.
# PostgreSQL corre en el host (pgAdmin); los contenedores lo alcanzan via
# host.docker.internal. Configura las credenciales en ".env" (ver .env.example).

x-backend: &backend
  build:
    context: ./siga_backend
    dockerfile: Dockerfile
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - ./siga_backend:/app
  restart: unless-stopped

x-db-env: &db-env
  DB_USER: ${DB_USER:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env (copia .env.example)}
  DB_HOST: ${DB_HOST:-host.docker.internal}
  DB_PORT: ${DB_PORT:-5432}
  DB_NAME: ${DB_NAME:-siga_core}
  NATS_URL: nats://nats:4222
  SECRET_KEY: ${SECRET_KEY:?Define SECRET_KEY en .env (ver .env.example)}
  # Bind mounts sobre Windows/OneDrive no emiten eventos inotify fiables:
  # forzar polling evita que --reload se caiga con "os error 5".
  WATCHFILES_FORCE_POLLING: "true"

services:
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ====== CORE GATEWAY ======
  siga-core:
    <<: *backend
    ports:
      - "8000:8000"
    environment:
      <<: *db-env
      REDIS_URL: redis://redis:6379
      # Unico usuario que se crea al reconstruir la BD (core_users vacia).
      # Sin SIGA_ADMIN_PASSWORD, en desarrollo se genera una y se muestra en el log.
      SIGA_ADMIN_EMAIL: ${SIGA_ADMIN_EMAIL:-admin@siga.edu}
      SIGA_ADMIN_PASSWORD: ${SIGA_ADMIN_PASSWORD:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    depends_on:
      nats:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ====== MICROSERVICES ======
  mod-usuarios:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-usuarios && uvicorn main:app --host 0.0.0.0 --port 8001 --reload"]
    ports:
      - "8001:8001"
    environment:
      <<: *db-env
      PORT: "8001"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-planes-estudio:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-planes-estudio && uvicorn main:app --host 0.0.0.0 --port 8002 --reload"]
    ports:
      - "8002:8002"
    environment:
      <<: *db-env
      PORT: "8002"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-programas-estudio:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-programas-estudio && uvicorn main:app --host 0.0.0.0 --port 8005 --reload"]
    ports:
      - "8005:8005"
    environment:
      <<: *db-env
      PORT: "8005"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-gestion-academica:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-gestion-academica && uvicorn main:app --host 0.0.0.0 --port 8006 --reload"]
    ports:
      - "8006:8006"
    environment:
      <<: *db-env
      PORT: "8006"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-auditoria:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-auditoria && uvicorn main:app --host 0.0.0.0 --port 8007 --reload"]
    ports:
      - "8007:8007"
    environment:
      <<: *db-env
      PORT: "8007"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-evaluacion:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-evaluacion && uvicorn main:app --host 0.0.0.0 --port 8008 --reload"]
    ports:
      - "8008:8008"
    environment:
      <<: *db-env
      PORT: "8008"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy

  mod-admision:
    <<: *backend
    command: ["sh", "-c", "cd modules/mod-admision && uvicorn main:app --host 0.0.0.0 --port 8009 --reload"]
    ports:
      - "8009:8009"
    environment:
      <<: *db-env
      PORT: "8009"
      SKIP_MIGRATIONS: "true"
    depends_on:
      nats:
        condition: service_healthy
    volumes:
      - ./siga_backend:/app
      - ./docs:/app/docs

  # ====== FRONTEND (Vite dev server) ======
  siga-frontend:
    build:
      context: ./siga_frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:5173"
      - "5173:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_PROXY_TARGET: http://siga-core:8000
    volumes:
      - ./siga_frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - siga-core
    restart: unless-stopped

volumes:
  frontend_node_modules:
